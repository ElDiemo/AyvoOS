# AYVO OS — DEV (ADR 0026). Docker binds the preview's ports to the server's Tailscale IPv4
# address. At boot Docker may start before tailscaled has assigned it; allowing a bind to a
# not-yet-present address lets the containers start anyway (they become reachable when the tailnet
# address appears; nothing is ever bound to a public address instead).
net.ipv4.ip_nonlocal_bind = 1
