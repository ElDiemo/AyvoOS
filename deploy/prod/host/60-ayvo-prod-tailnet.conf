# AYVO OS — PROD (doc 036). Docker binds the published ports to the server's Tailscale IPv4
# address; at boot Docker may start before tailscaled has assigned it. Allowing a bind to a
# not-yet-present address lets the containers start (reachable once the address appears);
# nothing is ever bound to a public address instead.
net.ipv4.ip_nonlocal_bind = 1
