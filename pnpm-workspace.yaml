packages:
  - apps/*
  - packages/*
  - ops/*

# New dependency resolutions must be at least a week old; never auto-exempt fresh releases.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

# Only these dependencies may run install scripts (supply-chain hardening).
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  unrs-resolver: true
