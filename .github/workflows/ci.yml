# AYVO OS continuous integration (doc 017, "CI").
#
# Checks only — CI never deploys, never uses secrets and never reaches the DEV preview or
# production. Databases are disposable service containers that exist only for one job.
# The job names (quality, test, e2e) are the check names required by the "Protect main" ruleset:
# keep them stable.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token; no job needs more.
permissions:
  contents: read

# A new push to a pull request cancels its obsolete runs; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json "packageManager")
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Disposable: created for this job and destroyed with it. Not a secret, never reused.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ayvo_ci
          POSTGRES_PASSWORD: ayvo_ci_disposable
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ayvo_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Test runs create and drop their own ayvo_test_<random> database on this server.
      AYVO_TEST_DATABASE_URL: postgresql://ayvo_ci:ayvo_ci_disposable@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json "packageManager")
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Guard - disposable local services only
        run: |
          test ! -e .env || { echo "::error::.env must not exist in CI"; exit 1; }
          case "$AYVO_TEST_DATABASE_URL" in
            postgresql://*@localhost:5432/*) ;;
            *) echo "::error::tests may only use the job's own PostgreSQL service"; exit 1 ;;
          esac
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Unit and integration tests (types, ui, api, web)
        run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ayvo_ci
          POSTGRES_PASSWORD: ayvo_ci_disposable
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ayvo_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Playwright starts the built API on a fresh ayvo_e2e database of this service
      # (apps/api/scripts/start-e2e-server.mjs) and the web app on localhost:3100.
      AYVO_TEST_DATABASE_URL: postgresql://ayvo_ci:ayvo_ci_disposable@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json "packageManager")
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Guard - disposable local services only
        run: |
          test ! -e .env || { echo "::error::.env must not exist in CI"; exit 1; }
          case "$AYVO_TEST_DATABASE_URL" in
            postgresql://*@localhost:5432/*) ;;
            *) echo "::error::e2e may only use the job's own PostgreSQL service"; exit 1 ;;
          esac
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Playwright browser (Chromium)
        run: pnpm --filter @ayvo/web exec playwright install --with-deps chromium
      - name: Playwright end-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright results (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
