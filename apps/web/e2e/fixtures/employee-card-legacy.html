<!doctype html>
<!-- Visual reference: public id.ayvo.co PHP output, 2026-10-23.
     Original layout/CSS with synthetic placeholders only; never real staff data.
     Fonts and logo are the unchanged original assets, served locally. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="{{ORIGIN}}/" />
    <style>
      @font-face {
        font-family: 'Font Awesome 6 Free';
        font-style: normal;
        font-weight: 900;
        font-display: block;
        src: url('/employee-card/fa-solid-900.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Font Awesome 6 Brands';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/employee-card/fa-brands-400.woff2') format('woff2');
      }
      .fa-solid,
      .fas,
      .fab {
        display: inline-block;
        font-style: normal;
        font-variant: normal;
        line-height: 1;
        text-rendering: auto;
        -webkit-font-smoothing: antialiased;
      }
      .fa-solid,
      .fas {
        font-family: 'Font Awesome 6 Free';
        font-weight: 900;
      }
      .fab {
        font-family: 'Font Awesome 6 Brands';
        font-weight: 400;
      }
      .fa-arrow-up-right-from-square::before {
        content: '\f35d';
      }
      .fa-phone::before {
        content: '\f095';
      }
      .fa-envelope::before {
        content: '\f0e0';
      }
      .fa-linkedin::before {
        content: '\f08c';
      }
      .fa-id-card::before {
        content: '\f2c2';
      }
      :root {
        --bg: #f6f6f6;
        --card: #ffffff;
        --text: #111;
        --muted: #6f6f6f;
        --line: #e6e6e6;
        --btn: #fafafa;
        --btnHover: #f0f0f0;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
        --radius: 26px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 36px 28px 28px;
        text-align: center;
      }
      .avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        overflow: hidden;
        margin: 0 auto 18px;
        border: 4px solid #fff;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
        background: #ddd;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .name {
        font-size: 1.95em;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .role {
        margin-top: 4px;
        color: var(--muted);
      }
      .company {
        margin-top: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .tagline {
        margin: 10px auto 22px;
        max-width: 340px;
        font-size: 0.95em;
        color: #7d7d7d;
        line-height: 1.45;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px;
        margin: 10px 0;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--btn);
        color: #222;
        text-decoration: none;
        transition: 0.15s;
      }
      .btn:hover {
        background: var(--btnHover);
        transform: translateY(-1px);
      }
      .btn.primary {
        background: #111;
        border-color: #111;
        color: #fff;
      }
      .btn.primary:hover {
        background: #000;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 18px 0;
      }
      .footer {
        font-size: 0.85em;
        color: #9a9a9a;
      }
      .footer a {
        color: #9a9a9a;
        text-decoration: none;
      }
      .footer a:hover {
        color: #111;
        text-decoration: underline;
      }
      .logo {
        margin-top: 14px;
      }
      .logo img {
        height: 24px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="avatar"><img src="{{PHOTO}}" alt="Jana Vizitková" /></div>
      <div class="name">Jana Vizitková</div>
      <div class="role">Obchodní zástupkyně</div>
      <div class="tagline">Syntetická ukázka, nikoli skutečný zaměstnanec.</div>
      <a class="btn primary" href="https://example.com" target="_blank"
        ><i class="fa-solid fa-arrow-up-right-from-square"></i> Visit AYVO</a
      >
      <a class="btn" href="tel:+420111222333"><i class="fas fa-phone"></i> Call</a>
      <a class="btn" href="mailto:vizitka@example.com"><i class="fas fa-envelope"></i> Email</a>
      <a class="btn" href="https://www.linkedin.com/in/example" target="_blank"
        ><i class="fab fa-linkedin"></i> LinkedIn</a
      >
      <a class="btn" href="{{CONTACT}}"><i class="fas fa-id-card"></i> Save contact</a>
      <div class="divider"></div>
      <div class="footer">
        <div class="logo"><img src="employee-card/legacy-logo.svg" alt="AYVO®" /></div>
      </div>
    </div>
  </body>
</html>
